<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valkurm Pathing Nodes</title>
<style>
  :root { --bg: #111418; --panel: #1b2026; --ink: #e6e9ee; --muted: #8a94a3; --grid: #2a313a;
          --ours: #6b7684; --link: #2c343d; --matched: #3fb27f; --new: #e2559b; --probe: #4c8dd6;
          --open: #f0a33a; --bot: #ff5c5c; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
  #hud { position: fixed; top: 12px; left: 12px; background: var(--panel); padding: 10px 12px; border-radius: 6px;
         max-width: calc(100vw - 48px); box-shadow: 0 2px 8px #0006; }
  #hud b { font-weight: 600; }
  #hud .row { display: flex; gap: 14px; flex-wrap: wrap; }
  #hud .muted { color: var(--muted); }
  .key { display: inline-flex; align-items: center; gap: 5px; margin-right: 10px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  #tip { position: fixed; pointer-events: none; background: var(--panel); padding: 4px 8px; border-radius: 4px; display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="row" id="stats">Loading</div>
  <div class="row muted" style="margin-top:6px">
    <span class="key"><span class="dot" style="background:var(--ours)"></span>our node</span>
    <span class="key"><span class="dot" style="background:var(--matched)"></span>trust confirmed</span>
    <span class="key"><span class="dot" style="background:var(--new)"></span>new node</span>
    <span class="key"><span class="dot" style="background:var(--probe)"></span>probe</span>
    <span class="key"><span class="dot" style="background:var(--open)"></span>open circle</span>
    
  </div>
  <div class="muted" id="when"></div>
</div>
<div id="tip"></div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let stat = null, st = null, view = null, fitted = false;

function resize() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; draw(); }
addEventListener('resize', resize);

function fit() {
  const pts = (st.probes.length ? st.probes.map(p => [p[0], p[1]]) : stat.nodes.map(n => [n[0], n[1]]));
  if (st.bot) pts.push(st.bot);
  const xs = pts.map(p => p[0]), zs = pts.map(p => p[1]);
  const pad = 40, x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad, z0 = Math.min(...zs) - pad, z1 = Math.max(...zs) + pad;
  const s = Math.min(cv.width / (x1 - x0), cv.height / (z1 - z0));
  view = { s, cx: (x0 + x1) / 2, cz: (z0 + z1) / 2 };
}
// Screen y grows down, so world z is flipped to keep north up.
const sx = x => cv.width / 2 + (x - view.cx) * view.s;
const sy = z => cv.height / 2 - (z - view.cz) * view.s;

function dot(x, z, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(sx(x), sy(z), r, 0, 7); ctx.fill(); }

function draw() {
  if (!stat || !st || !view) return;
  if (!(view.s > 0) && cv.width > 0) fit();
  const dpr = devicePixelRatio;
  ctx.fillStyle = css('--bg'); ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.lineWidth = 1 * dpr;
  ctx.strokeStyle = css('--link');
  ctx.beginPath();
  for (const [a, b] of stat.links) {
    const p = stat.nodes[a], q = stat.nodes[b];
    ctx.moveTo(sx(p[0]), sy(p[1])); ctx.lineTo(sx(q[0]), sy(q[1]));
  }
  ctx.stroke();
  ctx.fillStyle = css('--probe') + '14';
  for (const p of st.probes) {
    ctx.beginPath(); ctx.arc(sx(p[0]), sy(p[1]), Math.hypot(p[2] - p[0], p[3] - p[1]) * view.s, 0, 7); ctx.fill();
  }
  const matched = new Set(st.matched);
  stat.nodes.forEach((n, i) => {
    ctx.strokeStyle = matched.has(i) ? css('--matched') : css('--ours');
    ctx.beginPath(); ctx.arc(sx(n[0]), sy(n[1]), Math.max(2 * dpr, n[2] * view.s), 0, 7); ctx.stroke();
  });
  ctx.strokeStyle = css('--probe') + '99';
  ctx.beginPath();
  for (const p of st.probes) { ctx.moveTo(sx(p[0]), sy(p[1])); ctx.lineTo(sx(p[2]), sy(p[3])); }
  ctx.stroke();
  for (const p of st.probes) dot(p[0], p[1], 1.5 * dpr, css('--probe'));
  for (const l of st.landed) dot(l[0], l[1], 3 * dpr, css('--matched'));
  for (const n of st.new) dot(n[0], n[1], 5 * dpr, css('--new'));
  ctx.strokeStyle = css('--open'); ctx.lineWidth = 1.5 * dpr;
  for (const o of st.open) {
    const x = sx(o[0]), y = sy(o[1]), r = 3 * dpr;
    ctx.beginPath(); ctx.moveTo(x - r, y - r); ctx.lineTo(x + r, y + r); ctx.moveTo(x + r, y - r); ctx.lineTo(x - r, y + r); ctx.stroke();
  }
  ctx.strokeStyle = css('--muted');
  for (const o of st.skipped || []) {
    const x = sx(o[0]), y = sy(o[1]), r = 3 * dpr;
    ctx.beginPath(); ctx.moveTo(x - r, y - r); ctx.lineTo(x + r, y + r); ctx.moveTo(x + r, y - r); ctx.lineTo(x - r, y + r); ctx.stroke();
  }
  ctx.strokeStyle = css('--open');
  if (st.queue.length) {
    ctx.setLineDash([4 * dpr, 4 * dpr]);
    ctx.beginPath();
    const path = st.bot ? [st.bot, ...st.queue] : st.queue;
    path.forEach((p, i) => i ? ctx.lineTo(sx(p[0]), sy(p[1])) : ctx.moveTo(sx(p[0]), sy(p[1])));
    ctx.stroke(); ctx.setLineDash([]);
  }
  if (st.bot) dot(st.bot[0], st.bot[1], 6 * dpr, css('--bot'));
}

async function load() {
  try {
    if (!stat) stat = await (await fetch('static.json')).json();
    st = await (await fetch('state.json?' + Date.now())).json();
  } catch (e) { document.getElementById('when').textContent = 'Waiting for data'; return; }
  if (!fitted) { fit(); fitted = true; }
  const s = st.stats;
  document.getElementById('stats').innerHTML =
    `<span><b>${s.bot_probes}</b> own probes</span><span><b>${s.probes}</b> total</span>` +
    `<span><b>${s.new}</b> new nodes</span><span><b>${s.proven}</b> of ${s.circles} circles proven</span>` +
    `<span><b>${s.open}</b> open</span><span><b>${s.skipped}</b> skipped</span><span><b>${s.failed}</b> failed</span><span><b>${s.unreached || 0}</b> unreached</span><span>ring <b>${st.ring === undefined ? '-' : st.ring}</b></span>`;
  document.getElementById('when').textContent = 'Updated ' + new Date(st.updated * 1000).toLocaleTimeString();
  draw();
}

let drag = null;
cv.addEventListener('mousedown', e => { drag = [e.clientX, e.clientY]; cv.style.cursor = 'grabbing'; });
addEventListener('mouseup', () => { drag = null; cv.style.cursor = 'grab'; });
addEventListener('mousemove', e => {
  if (drag && view) {
    view.cx -= (e.clientX - drag[0]) * devicePixelRatio / view.s;
    view.cz += (e.clientY - drag[1]) * devicePixelRatio / view.s;
    drag = [e.clientX, e.clientY]; draw();
  }
  const tip = document.getElementById('tip');
  if (!view) return;
  const wx = view.cx + (e.clientX * devicePixelRatio - cv.width / 2) / view.s;
  const wz = view.cz - (e.clientY * devicePixelRatio - cv.height / 2) / view.s;
  tip.style.display = 'block'; tip.style.left = (e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
  tip.textContent = `X ${wx.toFixed(1)}  Z ${wz.toFixed(1)}`;
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  if (!view) return;
  const k = Math.exp(-e.deltaY * 0.0015);
  const mx = e.clientX * devicePixelRatio, my = e.clientY * devicePixelRatio;
  const wx = view.cx + (mx - cv.width / 2) / view.s, wz = view.cz - (my - cv.height / 2) / view.s;
  view.s *= k;
  view.cx = wx - (mx - cv.width / 2) / view.s; view.cz = wz + (my - cv.height / 2) / view.s;
  draw();
}, { passive: false });
cv.addEventListener('dblclick', () => { fit(); draw(); });

resize();
load();
setInterval(load, 30000);
</script>
</body>
</html>
